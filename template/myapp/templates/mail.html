<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ title }}</title>
  </head>
  <body>
    <h1>{{ title }}</h1>
    {% for i in new %}
    <p>
      {% if src(i.image) %}<a href="{{ i.url }}"><img src="{{ src(i.image) }}" alt="" width="240" /></a
      ><br />{% endif %}
      <a href="{{ i.url }}">{{ i.name }}</a> {{ i.price }} ({{ i.source }})
    </p>
    {% endfor %}
    <h2>Coverage</h2>
    <ul>
      {% for line in coverage %}
      <li>{{ line }}</li>
      {% endfor %}
    </ul>
    <p><a href="{{ link('/') }}">Open Myapp</a></p>
  </body>
</html>
